name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GATE_REQUIRE_OFFLINE_INTEGRATION: "1"
    strategy:
      fail-fast: false
      matrix:
        node: ["22.20.0", "24.x"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Make the selected Node runtime read-only to the test user
        run: |
          node_root="$(dirname "$(dirname "$(node -p 'process.execPath')")")"
          sudo chown -R root:root "$node_root"
          sudo chmod -R u=rwX,go=rX "$node_root"

      - name: Initialize private runtime path
        run: echo "GATE_HOME=$RUNNER_TEMP/gate" >> "$GITHUB_ENV"

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Install the offline-lane system prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap

      - name: Prepare the exact managed REA runtime
        run: |
          node ./bin/gate.mjs bootstrap --json
          node ./bin/gate.mjs upstream install rea-stable --json

      - name: Run tests
        run: npm test

      - name: Validate repository contracts
        run: npm run check
